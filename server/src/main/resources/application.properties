quarkus.application.name=pdf-ua-generator
# Fast-jar packaging: dependencies stay separate JARs (LGPL), no uber-jar.
quarkus.package.jar.type=fast-jar

# PostgreSQL: QUARKUS_DATASOURCE_JDBC_URL, _USERNAME, _PASSWORD. In dev and test
# mode, Dev Services start a PostgreSQL container (podman).
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
# A rolling deployment can start the service before its database is reachable.
# Retry the first connection instead of failing to start.
quarkus.flyway.connect-retries=10
quarkus.flyway.connect-retries-interval=2s
# Tests reset the schema between runs (ApiTest), so allow clean under the test
# profile only; it stays disabled everywhere else.
%test.quarkus.flyway.clean-disabled=false

# Bundles and multipart render requests with attachments.
quarkus.http.limits.max-body-size=60M

# Kubernetes removes the pod from its Service asynchronously to SIGTERM, so keep
# answering for a while before shutting down, then let running renders finish.
quarkus.shutdown.delay=5s
quarkus.shutdown.timeout=30s

# Files of a template revision, by content hash. Revisions are immutable, so an
# entry is never stale; an evicted one is read from the database again. Sized by
# entries, not bytes: a revision with embedded fonts is far larger than one
# without, so leave headroom.
quarkus.cache.caffeine."template-revisions".maximum-size=64
quarkus.cache.caffeine."template-revisions".metrics-enabled=true

# Prometheus scrapes /q/metrics: executor.* for the render pool, cache.* for the
# revision cache, http.server.requests for the API.
quarkus.micrometer.binder.http-server.enabled=true

# Image: built by Jib (mise run image); the base image and the AOT cache are
# configured in the Maven profile "image" of server/pom.xml.
quarkus.container-image.group=itbh
quarkus.container-image.name=pdf-ua-generator
quarkus.jib.base-jvm-image=${jre.base-image:registry.access.redhat.com/ubi9/openjdk-25-runtime:1.24}
quarkus.jib.docker-executable-name=podman

# Without OIDC for now: every endpoint is open.
