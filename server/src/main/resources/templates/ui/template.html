{#include ui/base}
{#title}{template.id}{/title}
<p><a href="/ui">← Templates</a></p>
<h1>{template.id} <small>{template.kind}</small></h1>

<h2>Revisions</h2>
{#include ui/revisions /}

{#if dependents}
<h2>Used by</h2>
<table>
  <thead>
    <tr><th>Template</th><th>Revision</th><th>Status</th><th>Layout revision</th></tr>
  </thead>
  <tbody>
    {#for d in dependents}
    <tr>
      <td><a href="/ui/templates/{d.templateId}">{d.templateId}</a></td>
      <td>{d.number}</td>
      <td><span class="status {d.status}">{d.status}</span></td>
      <td>{d.layoutRevision}</td>
    </tr>
    {/for}
  </tbody>
</table>
{/if}
{/include}
