apiVersion: v1
kind: Service
metadata:
  name: {{ include "pdf-ua-generator.fullname" . }}
  labels:
    {{- include "pdf-ua-generator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "pdf-ua-generator.selectorLabels" . | nindent 4 }}
