apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pdf-ua-generator.fullname" . }}
  labels:
    {{- include "pdf-ua-generator.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pdf-ua-generator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pdf-ua-generator.labels" . | nindent 8 }}
      {{- if or .Values.podAnnotations .Values.metrics.scrapeAnnotations }}
      annotations:
        {{- if .Values.metrics.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /q/metrics
        prometheus.io/port: "8080"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: {{ .Values.database.jdbcUrl | quote }}
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "pdf-ua-generator.databaseSecret" . }}
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pdf-ua-generator.databaseSecret" . }}
                  key: password
            - name: QUARKUS_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- with .Values.config.publicBaseUrl }}
            - name: PDFUAGEN_PUBLIC_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.allowedHosts }}
            - name: PDFUAGEN_FETCH_ALLOWED_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.config.renderThreads }}
            - name: PDFUAGEN_RENDER_THREADS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.revisionCacheSize }}
            - name: QUARKUS_CACHE_CAFFEINE__TEMPLATE_REVISIONS__MAXIMUM_SIZE
              value: {{ . | quote }}
            {{- end }}
          # The warm-up renders every published template before the instance is ready.
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
