<html xmlns="http://www.w3.org/1999/xhtml" lang="{doc:lang}">

<head>
    <title>{#insert title}Memo layout{/insert}</title>
    <meta name="author" content="IT Beratung Hermann GmbH" />
    {#insert head}<meta name="description" content="Preview of the layout with its default content." />{/insert}
    <link rel="stylesheet" href="layout/memo.css" />
    <style>
        @page {
            size: A4;
            margin: 30mm 18mm 22mm 30mm;

            @top-left {
                font-family: 'Special Elite';
                font-size: 10pt;
                color: #8b1e1e;
                content: "{msg:header}";
            }

            @bottom-center {
                font-family: 'Special Elite';
                font-size: 9pt;
                color: #8b1e1e;
                content: "— " counter(page) " / " counter(pages) " —";
            }

            @footnote {
                border-top: 0.5pt dashed #8b1e1e;
                padding-top: 2mm;
            }
        }
    </style>
</head>

<body>
    <p class="letterhead"><img class="logo" src="layout/logo.svg" alt="{msg:logo}" /></p>
    <p class="memo-label">{msg:memo}</p>
    <h1 id="top">{#insert title}Memo layout{/insert}</h1>
    {#insert body}
    <p>Content templates fill this area. The layout alone shows this text as a preview.</p>
    {/insert}
</body>

</html>
