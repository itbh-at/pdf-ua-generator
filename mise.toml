# mise: single source of truth for all toolchains of this project.
# The same file is read on developer machines, in CI and inside container
# images, so every tool version is identical everywhere.
#
#   mise install            # installs the tools pinned below
#   mise run build          # compile, test and package all modules
#   mise run test           # run the tests
#   mise run dev            # REST service in dev mode on http://localhost:8080
#   mise run fmt            # format the Java sources (Google Java Style)
#   mise run setup-hooks    # once per clone: pre-commit checks the formatting
#   mise run bench          # render benchmark (JMH)
#   mise run image          # build the OCI image of the REST service
#   mise run check-chart    # render and validate the Helm chart
#   mise run smoke-test     # image + PostgreSQL under podman, imported and rendered
#   mise run load-test      # load test against a running service
#   mise run check-formats  # render the demo in every format and check each result
#   mise run docs           # build the Antora docs (documentation/build/site)
#   mise run docs-watch     # live preview of the docs
#   mise run headers        # apply the SPDX licence headers
#   mise run headers-check  # verify every file carries one

[tools]
java = "temurin-25.0.4+7.0.LTS"
maven = "3.9.16"
node = "24"                 # runtime for the Antora docs (documentation/build.sh)
"npm:antora" = "3.2.0"      # the `antora` CLI itself
# Full-text search for the docs. Not a CLI but a library antora `require`s;
# documentation/build.sh links it next to the playbook so antora finds it.
"npm:@antora/lunr-extension" = "1.0.0-alpha.13"
watchexec = "2.5.1"         # file-event watcher for `docs-watch`
"npm:browser-sync" = "3.0.4"  # live-preview server for `docs-watch`
helm = "3.22.0"             # renders the chart for Kubernetes and for podman kube play
kubeconform = "0.8.0"       # validates the rendered manifests against the Kubernetes schemas
k6 = "2.2.0"                # load test (scripts/load-test.js); AGPL-3.0, a test tool only
jbang = "0.141.0"           # runs the Quarkus agent MCP server (see .mcp.json)
"ubi:korandoru/hawkeye" = "6.5.1"  # licence-header tool; see licenserc.toml
# Accessibility check of the HTML outputs (scripts/axe-check.mjs); libraries,
# not CLIs — the script resolves them through `mise where`.
"npm:axe-core" = "4.13.0"
"npm:jsdom" = "30.1.0"

[env]
# The server tests start PostgreSQL through Quarkus Dev Services (Testcontainers)
# on podman. Host prerequisite: systemctl --user enable --now podman.socket
DOCKER_HOST = "unix://{{ env.XDG_RUNTIME_DIR | default(value='/run/user/1000') }}/podman/podman.sock"
# Ryuk, the Testcontainers reaper, needs a privileged container under podman;
# Quarkus removes its containers itself.
TESTCONTAINERS_RYUK_DISABLED = "true"

[tasks.build]
description = "Compile, test and package all modules"
run = "mvn -B -ntp verify"

[tasks.test]
description = "Run the tests of all modules"
run = "mvn -B -ntp test"

[tasks.fmt]
description = "Format the Java sources (Google Java Style, Spotless)"
run = "mvn -B -ntp -q spotless:apply"

[tasks.fmt-check]
description = "Check the Java formatting without changing files"
run = "mvn -B -ntp -q spotless:check"

[tasks.setup-hooks]
description = "Use the checked-in git hooks (pre-commit refuses unformatted Java sources)"
run = "git config core.hooksPath .githooks"

[tasks.dev]
description = "Run the REST service in Quarkus dev mode (PostgreSQL via Dev Services)"
run = '''
mvn -B -ntp -q -pl core -am install -DskipTests
mvn -B -ntp -f server/pom.xml quarkus:dev
'''

[tasks.check-chart]
description = "Render the Helm chart with both values files and validate the manifests"
run = "./scripts/check-chart.sh"

[tasks.smoke-test]
description = "Run the image with PostgreSQL under podman, import the demo bundles and render"
run = "./scripts/smoke-test.sh"

[tasks.load-test]
description = "Load test against a running service (k6); BASE_URL selects it"
run = "k6 run scripts/load-test.js"

[tasks.image]
description = "Build the OCI image of the REST service (Jib, with AOT cache)"
run = "mvn -B -ntp -pl server -am install -DskipTests -Pimage"

[tasks.check-formats]
description = "Render the demo in every format and check each (veraPDF, axe-core, ODF validator, LibreOffice)"
run = "./scripts/check-formats.sh"

[tasks.bench]
description = "Render benchmark (JMH): cold and warm, per format"
run = '''
mvn -B -ntp -q -pl core -am test-compile dependency:build-classpath \
    -Dmdep.outputFile=target/bench.classpath -Dmdep.includeScope=test
java -Djava.awt.headless=true \
    -cp "core/target/test-classes:core/target/classes:$(cat core/target/bench.classpath)" \
    org.openjdk.jmh.Main RenderBenchmark
'''

[tasks.docs]
description = "Build the Antora docs"
run = "./documentation/build.sh"

[tasks.docs-watch]
description = "Live preview of the Antora docs (rebuild on change)"
run = "./documentation/build.sh watch"

[tasks.headers]
description = "Apply the Apache-2.0 SPDX licence headers (hawkeye)"
run = "hawkeye format"

[tasks.headers-check]
description = "Check that all files carry the licence header"
run = "hawkeye check"
